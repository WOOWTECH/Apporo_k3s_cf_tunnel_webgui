{{- if not .Values.auth.existingSecret }}
{{- $adminPassword := include "cftw.resolveSecretValue" (dict "ctx" . "explicit" .Values.config.sensitive.admin_password "key" "admin_password") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cftw.secretName" . }}
  labels:
    {{- include "cftw.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin_password: {{ $adminPassword | quote }}
{{- end }}

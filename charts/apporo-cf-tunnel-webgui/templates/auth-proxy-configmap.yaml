{{- $app := .Values.app.port -}}
# nginx auth proxy: the single entrance of the pod.
#   /                 → the WebGUI on 127.0.0.1:{{ $app }}, behind basic auth (tenant admin_password)
#   /healthz          → nginx-local 200 (sidecar liveness)
#   /healthz-upstream → the app's /api/ready, auth-exempt (pod readiness)
# Host is passed through: the app accepts a WebSocket only from a page of the same origin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cftw.authProxyConfigMapName" . }}
  labels:
    {{- include "cftw.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 1;
    error_log  /dev/stderr notice;
    pid        /tmp/nginx.pid;
    events { worker_connections 512; }
    http {
      proxy_temp_path /tmp/proxy_temp;
      client_body_temp_path /tmp/client_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
      access_log /dev/stdout main;
      server_tokens off;
      sendfile on;
      keepalive_timeout 65;
      include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }
    server {
      listen {{ .Values.authProxy.port }};
      server_name _;
      client_max_body_size {{ .Values.authProxy.clientMaxBodySize }};
      auth_basic           "Apporo CF Tunnel Web";
      auth_basic_user_file /auth/.htpasswd;
      location = /healthz { auth_basic off; access_log off; return 200 "ok\n"; }
      location = /healthz-upstream {
        auth_basic off; access_log off;
        proxy_pass http://127.0.0.1:{{ $app }}/api/ready;
      }
      location / {
        proxy_pass http://127.0.0.1:{{ $app }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Log stream and Cloudflare login run over WebSockets; route changes
        # wait for the platform's Cloudflare update (up to ~2 minutes).
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }
    }

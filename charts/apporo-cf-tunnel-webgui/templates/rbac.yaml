{{- if .Values.rbac.create }}
# Read-only view of this namespace's Services, for the workspace services picker.
# Namespaced only; no Secrets, no Pods, no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cftw.fullname" . }}-services-reader
  labels:
    {{- include "cftw.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cftw.fullname" . }}-services-reader
  labels:
    {{- include "cftw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cftw.fullname" . }}-services-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "cftw.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

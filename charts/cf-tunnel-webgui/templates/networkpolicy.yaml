{{- if and .Values.rbac.create .Values.networkPolicy.apiServerCidrs }}
# Adds egress to the Kubernetes API (the namespace baseline already allows the
# public internet for cloudflared, DNS and same-namespace traffic).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cftw.fullname" . }}-apiserver
  labels:
    {{- include "cftw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cftw.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.networkPolicy.apiServerCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
